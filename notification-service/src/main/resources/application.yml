server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/jwt-public.pem
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.library.common.event.LoanEvent
        spring.json.trusted.packages: com.library.common.event

library:
  auth:
    base-url: http://localhost:8081
    client-id: internal-service
    client-secret: internal-secret
  http:
    connect-timeout: 2s
    read-timeout: 3s

notification:
  readers-url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [notification-service,%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/notifications
    username: library
    password: library
  kafka:
    bootstrap-servers: kafka:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ""
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json
library:
  auth:
    base-url: http://auth-service:8081
notification:
  readers-url: http://readers-service:8083
