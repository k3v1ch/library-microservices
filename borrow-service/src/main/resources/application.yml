server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: borrow-service
  datasource:
    url: jdbc:h2:mem:borrow;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/jwt-public.pem
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5

# Общая инфраструктура из library-common: адрес сервиса аутентификации и таймауты вызовов.
library:
  auth:
    base-url: http://auth-service
    client-id: internal-service
    client-secret: internal-secret
  http:
    connect-timeout: 2s
    read-timeout: 3s

borrow:
  borrow-period-days: 14
  max-active-borrows: 3
  max-extensions: 2
  due-soon-days: 2
  saga-timeout: 2m
  outbox-max-attempts: 5
  outbox:
    poll-interval-ms: 2000
  schedule:
    overdue-interval-ms: 60000
    saga-interval-ms: 30000
    release-interval-ms: 30000
  services:
    book-url: http://book-service
    user-url: http://user-service
    notifications-url: http://notification-service

resilience4j:
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Повторяем только то, что может пройти со второй попытки: сеть и 5xx.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.library.borrow.client.RemoteServiceException
      users:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.library.borrow.client.RemoteServiceException
  circuitbreaker:
    instances:
      catalog:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Бизнес-отказ (нет экземпляров) не должен открывать предохранитель.
        ignore-exceptions:
          - com.library.common.api.ApiException
      users:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.library.common.api.ApiException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    level: "%5p [borrow-service,%X{requestId:-}]"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/borrow
    username: library
    password: library
  kafka:
    bootstrap-servers: kafka:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ""
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json
library:
  auth:
    base-url: http://auth-service
borrow:
  services:
    book-url: http://book-service
    user-url: http://user-service
    notifications-url: http://notification-service
