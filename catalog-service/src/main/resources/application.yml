server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Публичный ключ лежит локально: проверка подписи не требует вызова auth-service.
          public-key-location: classpath:keys/jwt-public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [catalog-service,%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/catalog
    username: library
    password: library
  security:
    oauth2:
      resourceserver:
        jwt:
          # В docker-профиле ключи забираются по JWKS — так же, как это делается с Keycloak.
          public-key-location: ""
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json
