# Полный стенд: Postgres, Kafka, Eureka и сервисы.
# Перед запуском собрать jar-ы:  ./scripts/build.sh
# Затем:                         docker compose up --build
name: library

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  discovery-server:
    build:
      context: .
      args:
        SERVICE: discovery-server
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8081:8081"

  book-service:
    build:
      context: .
      args:
        SERVICE: book-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8082:8082"

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8083:8083"

  borrow-service:
    build:
      context: .
      args:
        SERVICE: borrow-service
    # Профиль kafka включает отправку событий в брокер вместо HTTP-доставки.
    environment:
      SPRING_PROFILES_ACTIVE: docker,kafka
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,kafka
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - auth-service
      - book-service
      - user-service
      - borrow-service
      - notification-service
    ports:
      - "8080:8080"
