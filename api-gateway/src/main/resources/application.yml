server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/jwt-public.pem
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        # lb:// — адрес берётся из Eureka по имени сервиса, а не из конфига
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/auth/**,/oauth2/token,/.well-known/**
        - id: books
          uri: lb://book-service
          predicates:
            - Path=/books/**
          filters:
            # Поиск книг — идемпотентный GET, его можно безопасно повторить.
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: SERVER_ERROR
        - id: users
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: borrow
          uri: lb://borrow-service
          predicates:
            - Path=/borrow/**
        - id: notifications
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

logging:
  pattern:
    level: "%5p [api-gateway]"

---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ""
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json
