server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/jwt-public.pem
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/oauth2/token,/.well-known/**
        - id: catalog
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/books/**
          filters:
            # Поиск по каталогу — идемпотентный GET, его можно безопасно повторить.
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: SERVER_ERROR
        - id: readers
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/readers/**
        - id: circulation
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/loans/**
        - id: notifications
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

logging:
  pattern:
    level: "%5p [api-gateway]"

---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ""
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**,/oauth2/token,/.well-known/**
        - id: catalog
          uri: http://catalog-service:8082
          predicates:
            - Path=/api/v1/books/**
        - id: readers
          uri: http://readers-service:8083
          predicates:
            - Path=/api/v1/readers/**
        - id: circulation
          uri: http://circulation-service:8084
          predicates:
            - Path=/api/v1/loans/**
        - id: notifications
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
